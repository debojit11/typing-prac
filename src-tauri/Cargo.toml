[package]
name = "typing-prac"
version = "0.1.0"
description = "Deliberate touch-typing key-pair practice"
edition = "2021"

[lib]
name = "typing_prac_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = "1"
